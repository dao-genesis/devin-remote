<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Devin Cloud · 备份管理</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0e1116;color:#cdd3de;font:13px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
.top{position:sticky;top:0;background:#161b22;border-bottom:1px solid #21262d;padding:8px 10px;z-index:5}
.title{font-size:15px;font-weight:600;color:#e6edf3}
.sub{font-size:11px;color:#8b949e;margin-top:2px}
.crumb{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:#8b949e;flex-wrap:wrap}
.crumb a{color:#58a6ff;cursor:pointer}
.tb{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid #21262d;align-items:center}
.search{flex:1;min-width:120px;background:#0d1117;color:#cdd3de;border:1px solid #30363d;border-radius:6px;padding:6px 9px;font-size:12px;outline:none}
.search:focus{border-color:#0e639c}
.btn{background:#21262d;color:#cdd3de;border:1px solid #30363d;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer}
.btn.pri{background:#0e639c;border-color:#0e639c;color:#fff}
.btn.on{background:#1c3a26;border-color:#2ea043;color:#7ee787}
.btn:active{opacity:.7}
#list{padding:6px 8px 60px}
/* 一级: 账号目录 */
.acc-dir{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.acc-dir:active{background:#1f2630}
.acc-dir.rm{border-color:#3d2d1c;background:#15120e}
.acc-dir .ad-r1{display:flex;align-items:center;gap:8px}
.acc-no{flex:0 0 auto;min-width:22px;height:20px;line-height:20px;text-align:center;font-size:12px;font-weight:800;color:#9cdcfe;background:#1c2733;border:1px solid #2d4a63;border-radius:4px;padding:0 4px}
.acc-no.rm{color:#d0965a;background:#2a2013;border-color:#4a3a1c}
.ad-name{flex:1;font-size:13px;font-weight:600;color:#e6edf3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad-folder{font-size:16px}
.ad-meta{font-size:11px;color:#8b949e;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.ad-pw{font-size:11px;color:#6e7681;font-family:monospace;margin-top:2px;word-break:break-all}
.ad-recent{font-size:12px;color:#c9d1d9;margin-top:4px;overflow:hidden}
.ad-recent b{color:#e6edf3;font-weight:600}
.ad-pv{font-size:11px;color:#8b949e;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ad-cp{font-size:11px;color:#58a6ff;cursor:pointer;margin-left:auto}
.tag{font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid}
.tag.rm{color:#d0965a;border-color:#4a3a1c;background:#2a2013}
.tag.auto{color:#8b949e;border-color:#30363d;background:#1a1f26}
/* 二级: 对话 */
.row{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:9px 10px;margin-bottom:7px}
.r1{display:flex;align-items:center;gap:7px}
.st{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:#6e7681}
.st.running{background:#3fb950}.st.finished{background:#58a6ff}.st.blocked{background:#f0883e}.st.expired{background:#f85149}
.s-title{flex:1;font-size:13px;color:#e6edf3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-meta{font-size:11px;color:#8b949e;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.acts{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.b{flex:1;min-width:46px;text-align:center;background:#21262d;border:1px solid #30363d;border-radius:6px;padding:5px 0;font-size:11.5px;cursor:pointer;color:#cdd3de;white-space:nowrap}
.b.pri{background:#0e639c;border-color:#0e639c;color:#fff}
.b.del{color:#f85149}
.empty{text-align:center;color:#6e7681;padding:30px 12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:9px 14px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90%}
.toast.show{opacity:1}.toast.fail{border-color:#f85149}.toast.ok{border-color:#3fb950}
.footer{text-align:center;color:#484f58;font-size:11px;padding:14px}
</style></head>
<body>
<div class="top">
  <div class="title">Devin Cloud · 备份管理</div>
  <div class="sub" id="sub">以备份为主 · 全机历史备份(含已移出库账号) · 按近期活跃时序</div>
  <div class="crumb" id="crumb"><span>🗂 全部备份</span></div>
</div>
<div class="tb" id="tb">
  <input class="search" id="q" placeholder="检索 账号 / 对话名称 / 文件夹…" oninput="onSearch()" autocomplete="off"/>
  <button class="btn pri" onclick="reload()">&#128260; 刷新</button>
  <button class="btn" id="autoBtn" onclick="toggleAuto()">隐藏自动化</button>
  <button class="btn" onclick="backupAllAcc()">&#128229; 全量备份</button>
</div>
<div id="list"><div class="empty">加载中…</div></div>
<div class="footer">Devin Cloud 手机版 · 以备份为本源 · 近期时序 · 道法自然</div>
<div class="toast" id="toast"></div>

<script src="devin-core.js"></script>
<script src="devin-cloud.js"></script>
<script>
var N = window.Native || {};
function _esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function toast(m,bad){ var t=document.getElementById("toast"); t.textContent=m; t.className="toast show"+(bad?" fail":" ok"); setTimeout(function(){t.className="toast";},2000); }
function stClass(s){ s=String(s||"").toLowerCase(); if(/run|work|active/.test(s))return"running"; if(/finish|complete|done/.test(s))return"finished"; if(/block|wait|stuck/.test(s))return"blocked"; if(/expir|fail|error/.test(s))return"expired"; return""; }
function fmtTime(t){ if(!t)return""; try{ var d=new Date(typeof t==="number"?t:Date.parse(t)); if(isNaN(d))return String(t).slice(0,16); return d.toLocaleString(); }catch(e){return String(t).slice(0,16);} }
function safeName(s){ return String(s||"").replace(/[\\\/:*?"<>|]/g,"_").slice(0,60); }

// ══════════════════════════════════════════════════════════════════════════
//  以「备份」为本源 (非以账号库为本源)：枚举本机全部备份夹(含已移出库账号),
//  按「近期活跃」时序排布(与近期对话同源逻辑), 剔除非本人自动化对话对排序的干扰。
//  · 活跃账号 → 带账号库序号;  已移出账号 → 无序号但可检索/查看/下载/复制账密。
//  · 数据一条不删; 自动化对话默认只「下沉」不隐藏, 可一键隐藏。
// ══════════════════════════════════════════════════════════════════════════

// 自动化对话判定 (与 switch.html / daopan.html 近期对话过滤同源·保守):
//   纯英文、动词起头的机器人任务名 / 样板仓库名 → 非本人自动化; 含中文一律保留。
function _isAutoConv(title){
  try{ if(window.DaoCloud&&DaoCloud.isAutoConv) return DaoCloud.isAutoConv(title); }catch(e){}
  var t=String(title||"").trim();
  return !!t && !/[\u4e00-\u9fff]/.test(t) && t.length<=3;   // 极简兜底 (DaoCloud 未载时)
}

var _libByKey={};   // 活跃账号库: email/id(lower) -> {acc,no}
function _buildLib(){
  _libByKey={}; var arr=[]; try{ arr=DaoCore.loadAcc()||[]; }catch(e){}
  arr.forEach(function(a,i){
    if(a.email) _libByKey[String(a.email).toLowerCase()]={acc:a,no:i+1};
    if(a.id)    _libByKey[String(a.id).toLowerCase()]={acc:a,no:i+1};
  });
  return arr;
}

var _groups=[];       // 备份宇宙(全量)
var _view=[];         // 当前渲染(过滤/排序后)
var _bkInline={}, _bkInlineSeq=1;
var VIEW="accts", CUR=null, CUR_NO=0, SESSIONS=[], Q="";
if(typeof window.__showAuto==="undefined") window.__showAuto=true;   // 默认显示全量(自动化下沉), 可一键隐藏

function loadGroups(){
  _groups=[];
  var libArr=_buildLib(), seen={};
  var folders=[];
  try{ if(N.vaultListBackupAccounts) folders=JSON.parse(N.vaultListBackupAccounts()||"[]")||[]; }catch(e){}
  folders.forEach(function(folder){
    if(folder==="_移出总账") return;
    var man=null, rm=null;
    try{ if(N.vaultReadBackup){ var mt=N.vaultReadBackup(folder,"manifest.json"); if(mt)man=JSON.parse(mt); } }catch(e){}
    try{ if(N.vaultReadBackup){ var rt=N.vaultReadBackup(folder,"移出记录.json"); if(rt)rm=JSON.parse(rt); } }catch(e){}
    var email=(man&&man.account&&man.account.email)||(rm&&rm.account&&rm.account.email)||folder;
    var sessions=(man&&man.sessions)?Object.keys(man.sessions).map(function(k){return man.sessions[k];}).filter(Boolean)
      .sort(function(x,y){return (y.backedUpAt||0)-(x.backedUpAt||0);}):[];
    if(!sessions.length){
      try{ if(N.vaultListBackups){ var fl=JSON.parse(N.vaultListBackups(folder)||"[]")||[]; var bySid={},legacy=[];
        fl.forEach(function(fn){ var n=typeof fn==="string"?fn:(fn&&fn.name)||""; var mz=n.match(/^sess-(.+)\.zip$/),mm=n.match(/^conv-(.+)\.md$/);
          if(mz){ bySid[mz[1]]=bySid[mz[1]]||{sid:mz[1],title:mz[1]}; bySid[mz[1]].zip=n; }
          else if(mm){ bySid[mm[1]]=bySid[mm[1]]||{sid:mm[1],title:mm[1]}; bySid[mm[1]].md=n; }
          else if(/^backup-.*\.json$/.test(n)) legacy.push(n); });
        sessions=Object.keys(bySid).map(function(k){return bySid[k];});
        if(!sessions.length && legacy.length && N.vaultReadBackup){
          legacy.sort(); var lgName=legacy[legacy.length-1], lg=null;
          try{ lg=JSON.parse(N.vaultReadBackup(folder,lgName)||"null"); }catch(e){}
          if(lg){
            if(lg.account&&lg.account.email&&email===folder) email=lg.account.email;
            if(!rm&&lg.account) rm={account:lg.account,removedAt:0,legacy:true};
            (lg.sessions||[]).forEach(function(s){ if(!s)return;
              sessions.push({sid:s.sid||s.id||"",title:s.title||s.sid||"(无标题)",inlineMd:(typeof s.md==="string"?s.md:""),backedUpAt:lg.savedAt?Date.parse(lg.savedAt)||0:0,legacyFile:lgName}); });
          }
        }
      } }catch(e){}
    }
    sessions.forEach(function(s){ if(s&&!s.folder)s.folder=folder; });
    var key=String(email).toLowerCase();
    var hit=_libByKey[key]||_libByKey[String(folder).toLowerCase()];
    var removed=!!rm || !hit;
    // 近期时序: 忽略自动化对话时间, 取本人对话最新备份时间; 无则退回全部/移出/添加时间
    var tHuman=0, tAny=0, sHuman=null, sAny=null;
    sessions.forEach(function(s){ var bt=Math.max(s.backedUpAt||0, s.ts||0); if(bt>tAny){tAny=bt;sAny=s;} if(!_isAutoConv(s.title||s.sid)&&bt>tHuman){tHuman=bt;sHuman=s;} });
    var t=tHuman||tAny||(rm?rm.removedAt:0)||(hit&&hit.acc&&(hit.acc.lastActiveAt||hit.acc.addedAt))||0;
    var allAuto=sessions.length>0 && sessions.every(function(s){return _isAutoConv(s.title||s.sid);});
    _groups.push({folder:folder,email:email,no:hit?hit.no:0,acc:hit?hit.acc:(rm?rm.account:null),
      logged:!!(hit&&hit.acc&&hit.acc.auth1&&hit.acc.orgId),removed:removed,removedAt:rm?rm.removedAt:0,
      sessions:sessions,t:t,allAuto:allAuto,recent:sHuman||sAny,recentIsHuman:!!sHuman});
    if(key)seen[key]=1; seen[String(folder).toLowerCase()]=1;
  });
  // 中央移出总账: 夹被同前缀号覆盖后, 总账仍在 → 移出号永远可寻
  try{ if(N.vaultListBackups){ var tl=JSON.parse(N.vaultListBackups("_移出总账")||"[]")||[];
    tl.forEach(function(fn){ var n=typeof fn==="string"?fn:(fn&&fn.name)||""; if(!/\.json$/.test(n))return;
      var rec=null; try{ rec=JSON.parse(N.vaultReadBackup("_移出总账",n)||""); }catch(e){}
      if(!rec||!rec.account) return; var em=rec.account.email||rec.account.id||n, k=String(em).toLowerCase();
      if(seen[k]){ for(var i=0;i<_groups.length;i++){ if(String(_groups[i].email).toLowerCase()===k){ _groups[i].removed=true; if(!_groups[i].removedAt)_groups[i].removedAt=rec.removedAt||0; if(!_groups[i].t)_groups[i].t=rec.removedAt||0; break; } } return; }
      _groups.push({folder:rec.folder||"_移出总账",email:em,no:0,acc:rec.account,logged:false,removed:true,removedAt:rec.removedAt||0,sessions:[],t:rec.removedAt||0,allAuto:false}); seen[k]=1;
    });
  } }catch(e){}
  // 账号库中「尚无备份夹」的活跃账号并入 → 活跃号绝不遗漏
  libArr.forEach(function(a,i){ var k=String(a.email||"").toLowerCase(), k2=String(a.id||"").toLowerCase();
    if((k&&seen[k])||(k2&&seen[k2])) return;
    _groups.push({folder:"",email:a.email||a.id||("acc"+(i+1)),no:i+1,acc:a,logged:!!(a.auth1&&a.orgId),removed:false,removedAt:0,sessions:[],t:(a.lastActiveAt||a.addedAt||0),allAuto:false});
    if(k)seen[k]=1; if(k2)seen[k2]=1;
  });
  // 近期活跃时序降序; 自动化-only 账号一律下沉(不删); 同档按序号靠前
  _groups.sort(function(x,y){
    if(x.allAuto!==y.allAuto) return x.allAuto?1:-1;
    if((y.t||0)!==(x.t||0)) return (y.t||0)-(x.t||0);
    return (x.no||99999)-(y.no||99999);
  });
  return _groups;
}

// 防抖检索: 几百账号时每击键全量过滤+全量重渲即卡顿之源 → 160ms 合并
var _qT=null;
function onSearch(){
  if(_qT) clearTimeout(_qT);
  _qT=setTimeout(function(){
    Q=(document.getElementById("q").value||"").trim().toLowerCase();
    LIM=PAGE;
    if(VIEW==="sessions"&&CUR) renderSessions(); else renderAccts();
  },160);
}
function toggleAuto(){
  window.__showAuto=!window.__showAuto;
  document.getElementById("autoBtn").className="btn"+(window.__showAuto?"":" on");
  document.getElementById("autoBtn").textContent=window.__showAuto?"隐藏自动化":"显示自动化";
  renderAccts();
}
function _grpMatch(g){
  if(!Q) return true;
  // 检索干草垛一次性拼好缓存 → 每击键不再对每组逐字段逐会话 String 化
  if(g._hay==null){
    var hs=[g.email,g.folder,(g.acc&&g.acc.id),(g.acc&&g.acc.password),(g.acc&&g.acc.orgName),(g.no?(""+g.no):"")];
    g.sessions.forEach(function(s){ hs.push(s.title||""); hs.push(s.sid||""); });
    g._hay=hs.join("\n").toLowerCase();
  }
  return g._hay.indexOf(Q)>=0;
}

// ── 一级: 备份账号目录 (备份为主·近期时序·分页渲染) ──
var PAGE=80, LIM=PAGE;
function moreAccts(){ LIM+=PAGE; renderAccts(); }
// 最近对话预览缓存: 预览要同步读本地备份 MD, 几百账号每次重渲全读一遍=卡顿之源 → 每组只读一次
function _pvOf(g){ if(g._pv==null){ var p=""; try{ p=_recentPreview(g)||""; }catch(e){} g._pv=p; } return g._pv; }
function renderAccts(){
  VIEW="accts"; CUR=null;
  document.getElementById("crumb").innerHTML='<span>🗂 全部备份</span>';
  var box=document.getElementById("list");
  if(!_groups.length){ box.innerHTML='<div class="empty">无本地备份记录 — 先在工具条点「全量备份」或开启「自动备份」</div>'; return; }
  _view=_groups.filter(function(g){ if(!window.__showAuto && g.allAuto) return false; return _grpMatch(g); });
  var nRm=0, nAuto=0; _groups.forEach(function(g){ if(g.removed)nRm++; if(g.allAuto)nAuto++; });
  document.getElementById("sub").textContent="共 "+_groups.length+" 个备份账号 (含 "+nRm+" 已移出库) · 近期活跃优先 · 自动化 "+nAuto+" 个"+(window.__showAuto?"(下沉)":"(已隐藏)");
  var html=_view.slice(0,LIM).map(function(g,i){
    var name=g.email||g.folder||("acc"+(g.no||i));
    var pw=(g.acc&&g.acc.password)||"";
    var noHtml=g.no?('<span class="acc-no">'+g.no+'</span>'):'<span class="acc-no rm">移</span>';
    var tags='';
    if(g.removed) tags+=' <span class="tag rm">已移出库'+(g.removedAt?('·'+new Date(g.removedAt).toLocaleDateString()):'')+'</span>';
    if(g.allAuto) tags+=' <span class="tag auto">自动化</span>';
    var when=g.t?fmtTime(g.t):"";
    var status=g.logged?"☁ 已登录·可备份":(g.removed?"🗄 本地备份·可查看/下载":"🔒 未登录·本地备份");
    return '<div class="acc-dir'+(g.removed?' rm':'')+'" onclick="openGrp('+i+')">'+
      '<div class="ad-r1">'+noHtml+
        '<span class="ad-folder">'+(g.removed?'🗄':'📁')+'</span>'+
        '<span class="ad-name" title="'+_esc(name)+'">'+_esc(name)+tags+'</span>'+
        (pw?('<span class="ad-cp" onclick="event.stopPropagation();cpGrp('+i+')">复制账密</span>'):'')+
      '</div>'+
      (pw?('<div class="ad-pw">'+_esc("密码: "+pw)+'</div>'):'')+
      (g.recent?('<div class="ad-recent">'+(g.recentIsHuman?'💬':'🤖')+' 最近'+(g.recentIsHuman?'对话':'对话(自动化)')+': <b>'+_esc(g.recent.title||g.recent.sid||"(无标题)")+'</b>'+
        (function(){var pv=_pvOf(g);return pv?('<div class="ad-pv">'+_esc(pv)+'</div>'):'';})()+'</div>'):'')+
      '<div class="ad-meta"><span>'+status+'</span>'+
        '<span>'+g.sessions.length+' 备份对话</span>'+
        (when?('<span>近期 '+_esc(when)+'</span>'):'')+
        ((g.acc&&g.acc.orgName)?('<span>'+_esc(g.acc.orgName)+'</span>'):'')+
      '</div>'+
    '</div>';
  }).join("");
  if(_view.length>LIM) html+='<div style="text-align:center;padding:12px 0"><button class="btn" onclick="moreAccts()" style="padding:8px 18px;font-size:13px">加载更多 (当前 '+LIM+' / 共 '+_view.length+')</button></div>';
  box.innerHTML = html || '<div class="empty">无匹配备份 · 清空搜索查看全部</div>';
}
// 最近真实对话内容预览: 优先内联 md, 否则读本地备份 md 前段 (去标题/空行 → 截短)
function _recentPreview(g){
  var s=g&&g.recent; if(!s) return "";
  var md="";
  try{ if(typeof s.inlineMd==="string"&&s.inlineMd) md=s.inlineMd; }catch(e){}
  try{ if(!md&&s.md&&g.folder&&N.vaultReadBackup) md=N.vaultReadBackup(g.folder, s.md)||""; }catch(e){}
  if(!md) return "";
  var lines=String(md).slice(0,4000).split(/\n/), out=[];
  for(var i=0;i<lines.length&&out.join(" ").length<120;i++){
    var ln=lines[i].replace(/^[#>\-\*\s\|`]+/,"").trim();
    if(!ln||/^!\[/.test(ln)||/^\[.*\]\(.*\)$/.test(ln)) continue;
    out.push(ln);
  }
  return out.join(" ").slice(0,120);
}
function cpGrp(i){ var g=_view[i]; if(!g||!g.acc)return; cpAcc(g.acc); }
function cpAcc(acc){ if(!acc)return; var t=(acc.email||acc.id||"")+"\n"+(acc.password||"");
  var done=false; try{ if(N.clip){ N.clip(t); done=true; } }catch(e){}
  if(!done){ try{ navigator.clipboard.writeText(t); done=true; }catch(e){} }
  toast(done?"已复制账号+密码":"复制失败",!done); }
function cpCur(){ if(CUR&&CUR.acc) cpAcc(CUR.acc); }

// ── 二级: 该账号的对话 (活跃→云端; 移出/未登录→本地备份) ──
async function openGrp(i){
  var g=_view[i]; if(!g)return;
  CUR=g; CUR_NO=g.no||0; VIEW="sessions"; SESSIONS=[];
  var name=g.email||g.folder;
  document.getElementById("crumb").innerHTML='<a onclick="renderAccts()">🗂 全部备份</a><span>›</span><span>'+(g.no?(g.no+'. '):'')+_esc(name)+'</span>'+
    (g.acc&&g.acc.password?'<a onclick="cpCur()" style="margin-left:auto">复制账密</a>':'');
  document.getElementById("sub").textContent=name+(g.removed?" · 已移出库·本地备份":" · "+((g.acc&&(g.acc.orgName||g.acc.orgId))||""));
  if(g.logged && g.acc){
    document.getElementById("list").innerHTML='<div class="empty">拉取云端对话…</div>';
    try{
      var r=await DaoCloud.listSessions(g.acc,200);
      if(r&&r.ok){ SESSIONS=r.sessions||[]; renderSessions(); if(SESSIONS.length)toast("✓ "+SESSIONS.length+" 个云端对话"); return; }
    }catch(e){}
    // 云端失败 → 退回本地备份
  }
  renderLocalSessions(g);
}

// 活跃账号云端会话渲染
function renderSessions(){
  if(CUR&&(!CUR.logged||!CUR.acc)){ renderLocalSessions(CUR); return; }
  var box=document.getElementById("list");
  if(!SESSIONS.length){ renderLocalSessions(CUR); return; }
  var html=SESSIONS.map(function(s,i){ return _sessMatch(s)?sessHtml(s,i):""; }).join("");
  box.innerHTML = html || '<div class="empty">无匹配对话 · 清空搜索查看全部</div>';
}
function _sessMatch(s){
  if(!Q) return true;
  var sid=s.devin_id||s.session_id||s.id||"";
  var title=s.title||s.name||s.prompt||sid;
  return String(title).toLowerCase().indexOf(Q)>=0 || String(sid).toLowerCase().indexOf(Q)>=0;
}

// 移出/未登录账号: 从本地备份夹渲染对话 (MD/ZIP/旧版整包内联) → 历史资源恒可查可下
function renderLocalSessions(g){
  var box=document.getElementById("list");
  if(!g){ box.innerHTML='<div class="empty">无数据</div>'; return; }
  _bkInline={}; _bkInlineSeq=1;
  var rows=g.sessions.filter(function(s){ return !Q || String(s.title||s.sid||"").toLowerCase().indexOf(Q)>=0; });
  if(!rows.length){
    box.innerHTML='<div class="empty">该账号本地无对话备份'+(g.removed?'<br><span style="font-size:11px;color:#6e7681">账密快照在 移出记录.json / _移出总账 · 可复制账密后重新添加回账号库</span>':'')+'</div>';
    return;
  }
  _LR=rows;
  var canEnter=!!(g.acc&&g.acc.auth1);   // 移出号账密快照含 auth1 → 照常可登录进入
  var html=rows.map(function(s,ri){
    var when=s.backedUpAt?fmtTime(s.backedUpAt):"";
    var openBtn='';
    if(s.inlineMd){ var ik=String(_bkInlineSeq++); _bkInline[ik]={title:s.title||s.sid,md:s.inlineMd}; openBtn='<span class="b" onclick="bkOpenInline(\''+ik+'\')">&#128065; 查看</span>'; }
    else if(s.md||s.zip){ openBtn='<span class="b" onclick="bkOpenMd(\''+_esc(s.folder||g.folder)+'\',\''+_esc(s.md||'')+'\',\''+_esc(s.zip||'')+'\')">&#128065; 查看</span>'; }
    var enterBtn=(canEnter&&s.sid)?('<span class="b" onclick="bkEnter('+ri+')" title="用账密快照登录并在网页端打开此对话">&#127760; 进入</span>'):'';
    var upBtn=(s.inlineMd||s.md||s.zip)?('<span class="b" onclick="bkUp('+ri+')" title="把本地备份 MD 注入当前 Devin 标签的上传框">&#11014; 传到当前页</span>'):'';
    var zipBtn=s.zip?('<span class="b pri" onclick="bkSaveZip(\''+_esc(s.folder||g.folder)+'\',\''+_esc(s.zip)+'\')">&#128230; 下载ZIP</span>'):'';
    return '<div class="row">'+
      '<div class="r1"><span class="st"></span><span class="s-title" title="'+_esc(s.title||s.sid)+'">'+_esc(String(s.title||s.sid).slice(0,80))+'</span></div>'+
      '<div class="s-meta">'+(when?'<span>备:'+_esc(when)+'</span>':'')+(s.legacyFile?'<span>旧版整包</span>':'')+'<span>本地备份</span></div>'+
      '<div class="acts">'+openBtn+enterBtn+upBtn+zipBtn+'</div>'+
    '</div>';
  }).join("");
  box.innerHTML = html || '<div class="empty">无匹配对话</div>';
}
var _LR=[];   // 当前本地备份行 (renderLocalSessions 过滤后)
// 本地备份行 进入: 账密快照登录 + 网页端打开对话 (与云端行同源)
function bkEnter(ri){ var s=_LR[ri]; if(!CUR||!s)return; _enterAccSess(CUR.acc, s.sid||"", s.title||""); }
// 本地备份行 传到当前页: 读本地 MD(内联/备份夹/整包内 md) → 投递上传框
async function bkUp(ri){
  var s=_LR[ri]; if(!CUR||!s)return;
  var g=CUR, md="";
  try{ if(s.inlineMd) md=s.inlineMd; }catch(e){}
  try{ if(!md&&s.md&&N.vaultReadBackup) md=N.vaultReadBackup(s.folder||g.folder, s.md)||""; }catch(e){}
  if(!md&&s.zip&&N.vaultReadBackupB64){ try{ var b64=N.vaultReadBackupB64(s.folder||g.folder, s.zip); if(b64) md=await DaoCloud.zipReadText(b64,"对话_人类可读.md")||""; }catch(e){} }
  if(!md){ toast("本地 MD 读取失败",true); return; }
  var base=_convBase(g.acc, g.no, s.title||s.sid);
  if(_deliverFiles([{name:base+".md", b64:_b64utf8(md)}])) toast("已投递到当前页上传框（若无 Devin 标签将提示）");
  else toast("投递失败 · 请更新 APK",true);
}
function bkOpenInline(key){ var e=_bkInline[key]; if(e&&e.md){ try{N.openText&&N.openText("【本地备份·旧版整包】"+e.title,e.md);}catch(x){} return;} toast("本地 MD 读取失败",true); }
async function bkOpenMd(folder,mdName,zipName){
  try{ if(mdName){ var md=N.vaultReadBackup?N.vaultReadBackup(folder,mdName):""; if(md){ N.openText&&N.openText("【本地备份】"+mdName,md); return; } } }catch(e){}
  try{ if(zipName && N.vaultReadBackupB64){ var b64=N.vaultReadBackupB64(folder,zipName); if(b64){ var m=await DaoCloud.zipReadText(b64,"对话_人类可读.md"); if(m){ N.openText&&N.openText("【本地备份·整包】"+zipName,m); return; } } } }catch(e){}
  toast("本地 MD 读取失败",true);
}
function bkSaveZip(folder,zipName){
  try{ var b64=N.vaultReadBackupB64?N.vaultReadBackupB64(folder,zipName):""; if(b64 && N.saveBase64File){ N.saveBase64File(zipName,b64); toast("✓ 已导出本地全量 ZIP"); return; } }catch(e){}
  toast("本地 ZIP 读取失败",true);
}

function sessHtml(s,i){
  var sid=s.devin_id||s.session_id||s.id||"";
  var title=s.title||s.name||s.prompt||sid;
  var st=s.status_enum||s.status||s.state||"";
  var created=s.created_at||s.created||"";
  // 与近期对话五按钮融合: 查看/进入/MD/传到当前页/全部文件 (紧凑尺寸省空间)
  return '<div class="row" data-sid="'+_esc(sid)+'">'+
    '<div class="r1"><span class="st '+stClass(st)+'" title="'+_esc(st)+'"></span>'+
    '<span class="s-title" title="'+_esc(title)+'">'+_esc(String(title).slice(0,80))+'</span></div>'+
    '<div class="s-meta"><span>'+_esc(String(sid).slice(0,24))+'</span>'+(st?'<span>'+_esc(st)+'</span>':'')+(created?'<span>建:'+_esc(fmtTime(created))+'</span>':'')+'</div>'+
    '<div class="acts">'+
      '<span class="b" onclick="viewMd('+i+',\'conversation\')">&#128065; 查看</span>'+

    '</div></div>';
}

// ── 进入: 切到该账号并在网页端前台打开此对话 (与近期对话面板 openAcc 同源) ──
function _enterAccSess(acc, sid, title){
  if(!acc){ toast("无账号信息",true); return; }
  if(!acc.auth1){ toast("此号未解锁(无 auth1), 先在切号面板登录",true); return; }
  try{ if(acc.id) localStorage.setItem("rtflow.active", acc.id); }catch(e){}
  var web="https://app.devin.ai/"+(sid?("sessions/"+String(sid).replace(/^devin-/,"")):"");
  try{
    if(sid && N.openAccountSession){ N.openAccountSession(JSON.stringify(acc), sid); }
    else if(N.openEntryNewTab){ N.openEntryNewTab(JSON.stringify(acc), web); }
    else { window.top.postMessage({__rtflow:"openDevin", url:web, acct:acc.email||acc.id||"", title:title||sid||""}, "*"); }
    toast("已切到 "+((acc.email||acc.id||"").split("@")[0])+" · 打开网页对话");
  }catch(e){ toast("打开失败",true); }
}
function enterSess(i){
  var s=SESSIONS[i]; if(!CUR||!s)return;
  _enterAccSess(CUR.acc, s.devin_id||s.session_id||s.id||"", s.title||s.name||"");
}

// ── 传到当前页: 对话完整记录 MD(+取数指引) 投递到当前 Devin 标签上传框 (与近期对话 uploadConv 同源) ──
function _b64utf8(s){ try{ return btoa(unescape(encodeURIComponent(s||""))); }catch(e){ return ""; } }
function _convBase(acc, no, title){
  return safeName([no||"", title||"", (acc&&(acc.email||acc.id))||"", (acc&&acc.password)||""].filter(Boolean).join("_"));
}
function _deliverFiles(files){
  if(!files.length) return false;
  try{ if(N.deliverConvFilesToPage){ N.deliverConvFilesToPage(JSON.stringify(files)); return true; } }catch(e){}
  try{ if(N.deliverConvToPage){ N.deliverConvToPage(files[0].name, files[0].b64); return true; } }catch(e){}
  try{ for(var i=0;i<files.length;i++) window.top.postMessage({ __rtflow:"daoUploadFile", name:files[i].name, mime:"text/markdown", b64:files[i].b64 }, "*"); return true; }catch(e){}
  return false;
}
async function upSess(i){
  var s=SESSIONS[i]; if(!CUR||!CUR.acc||!s)return;
  var acc=CUR.acc, sid=s.devin_id||s.session_id||s.id||"";
  toast("取对话记录…");
  try{
    var guide=""; try{ guide=N.accessGuideMd?N.accessGuideMd(JSON.stringify(acc), sid, s.title||sid):""; }catch(e){}
    var md="", title="", err="";
    try{ var r=await DaoCloud.exportSession(acc, sid, "conversation");
         if(r&&r.ok){ md=r.md||""; title=r.title||""; } else err=(r&&r.error)||""; }catch(e){ err=""+e; }
    var base=_convBase(acc, CUR_NO, title||s.title||sid);
    var files=[];
    if(md) files.push({name:base+".md", b64:_b64utf8(md)});
    if(guide) files.push({name:base+"_取数指引.md", b64:_b64utf8(guide)});
    if(!files.length){ toast("提取失败: "+err,true); return; }
    if(!md) toast("对话提取失败("+err+"), 仅投取数指引",true);
    if(_deliverFiles(files)) toast("已投递到当前页上传框（若无 Devin 标签将提示）");
    else toast("投递失败 · 请更新 APK",true);
  }catch(e){ toast("异常: "+e,true); }
}

async function viewMd(i,kind){
  var s=SESSIONS[i]; if(!CUR||!CUR.acc||!s)return;
  var sid=s.devin_id||s.session_id||s.id;
  toast("提取对话…");
  try{
    var r=await DaoCloud.exportSession(CUR.acc, sid, kind);
    if(!r.ok){ toast("提取失败: "+(r.error||""),true); return; }
    try{ N.openText && N.openText(r.title||sid, r.md); }catch(e){}
  }catch(e){ toast("异常: "+e,true); }
}
async function dlMd(i,kind){
  var s=SESSIONS[i]; if(!CUR||!CUR.acc||!s)return;
  var sid=s.devin_id||s.session_id||s.id;
  toast("下载 MD…");
  try{
    var r=await DaoCloud.exportSession(CUR.acc, sid, kind);
    if(!r.ok){ toast("提取失败: "+(r.error||""),true); return; }
    var fn=CUR_NO+"_"+safeName(CUR.acc.email||CUR.acc.id)+"/"+safeName(r.title||sid)+".md";
    try{ N.saveTextFile && N.saveTextFile(fn.replace(/\//g,"_"), r.md); }catch(e){}
  }catch(e){ toast("异常: "+e,true); }
}

// ── 下载单对话全部文件 → 打包 zip(含文件夹) → 同步到下载面板 ──
async function dlAll(i){
  var s=SESSIONS[i]; if(!CUR||!CUR.acc||!s)return;
  var acc=CUR.acc;
  var sid=s.devin_id||s.session_id||s.id;
  toast("打包全部文件…");
  try{
    var files=[];
    var conv=await DaoCloud.exportSession(acc, sid, "conversation");
    if(conv.ok) files.push({name:"conversation.md", data:conv.md});
    var wl=await DaoCloud.exportSession(acc, sid, "worklog");
    if(wl.ok) files.push({name:"worklog.md", data:wl.md});
    var ev=null;
    try{ ev=await DaoCloud.sessionEvents(acc, sid); if(ev&&ev.ok) files.push({name:"events.json", data:JSON.stringify(ev.events||[],null,2)}); }catch(e){}
    try{
      var cf=await DaoCloud.collectSessionFiles(acc, sid, (ev&&ev.events)||null, function(d,t){ if(d===1||d%20===0)toast("拉取产出文件 "+d+"/"+t); });
      if(cf&&cf.files&&cf.files.length){
        cf.files.forEach(function(x){ var p=(x.path||("_unpathed/"+x.key)).replace(/^\/+/,""); files.push({name:"files/"+p, b64:x.b64}); });
      }
      if(cf&&cf.index&&cf.index.length) files.push({name:"files/_index.json", data:JSON.stringify(cf.index,null,2)});
    }catch(e){}
    files.push({name:"meta.json", data:JSON.stringify({account:acc.email,accountNo:CUR_NO,session:sid,title:s.title||s.name,status:s.status_enum||s.status,exportedAt:new Date().toISOString()},null,2)});
    var zipName=CUR_NO+"_"+safeName(acc.email||acc.id)+"_"+safeName(s.title||sid)+".zip";
    var b64=buildZipBase64(files);
    var path="";
    try{ path=N.saveBase64File ? N.saveBase64File(zipName, b64) : ""; }catch(e){}
    if(!path){
      files.forEach(function(f){ if(f.data==null)return; try{ N.saveTextFile && N.saveTextFile(safeName(s.title||sid)+"_"+f.name.replace(/\//g,"_"), f.data); }catch(e){} });
      toast("✓ 已下载 "+files.length+" 个文件(逐个)");
    } else {
      toast("✓ 已打包 "+files.length+" 文件 → "+zipName);
    }
  }catch(e){ toast("打包异常: "+e,true); }
}

// ── 全量备份 (仅已登录活跃账号) ──

  loadGroups(); renderAccts();

// ════════════════════════════════════════════════════════════════════════
//  最小 ZIP 写入器 (store-only·无压缩) → base64 · 无需第三方库
// ════════════════════════════════════════════════════════════════════════
function _crc32(bytes){
  var c, crc=-1;
  if(!_crc32.tab){ _crc32.tab=[]; for(var n=0;n<256;n++){ c=n; for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); _crc32.tab[n]=c>>>0; } }
  for(var i=0;i<bytes.length;i++) crc=_crc32.tab[(crc^bytes[i])&0xFF]^(crc>>>8);
  return (crc^-1)>>>0;
}
function _utf8(str){
  var out=[],p=0;
  for(var i=0;i<str.length;i++){
    var c=str.charCodeAt(i);
    if(c<128) out[p++]=c;
    else if(c<2048){ out[p++]=192|(c>>6); out[p++]=128|(c&63); }
    else if(c>=0xD800&&c<=0xDBFF){ var c2=str.charCodeAt(++i); var cp=0x10000+((c&0x3FF)<<10)+(c2&0x3FF); out[p++]=240|(cp>>18); out[p++]=128|((cp>>12)&63); out[p++]=128|((cp>>6)&63); out[p++]=128|(cp&63); }
    else { out[p++]=224|(c>>12); out[p++]=128|((c>>6)&63); out[p++]=128|(c&63); }
  }
  return out;
}
function _u16(n){ return [n&0xFF,(n>>8)&0xFF]; }
function _u32(n){ return [n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>24)&0xFF]; }
function _b64ToBytes(b64){
  var B="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  if(!_b64ToBytes.L){ _b64ToBytes.L={}; for(var i=0;i<B.length;i++)_b64ToBytes.L[B.charAt(i)]=i; }
  var L=_b64ToBytes.L;
  var s=String(b64||"").replace(/[\r\n\t ]/g,"");
  var pad=s.indexOf("="); if(pad>=0) s=s.substring(0,pad);
  var out=[],n=s.length;
  for(var j=0;j<n;j+=4){
    var e0=L[s.charAt(j)],e1=L[s.charAt(j+1)],e2=L[s.charAt(j+2)],e3=L[s.charAt(j+3)];
    if(e0==null||e1==null)break;
    out.push((e0<<2)|(e1>>4));
    if(e2!=null)out.push(((e1&15)<<4)|(e2>>2));
    if(e3!=null)out.push(((e2&3)<<6)|e3);
  }
  return out;
}
function buildZipBase64(files){
  var local=[], central=[], offset=0;
  files.forEach(function(f){
    var nameBytes=_utf8(f.name);
    var dataBytes=(f.b64!=null)?_b64ToBytes(f.b64):_utf8(f.data==null?"":String(f.data));
    var crc=_crc32(dataBytes);
    var lh=[].concat(_u32(0x04034b50),_u16(20),_u16(0x0800),_u16(0),_u16(0),_u16(0),_u32(crc),_u32(dataBytes.length),_u32(dataBytes.length),_u16(nameBytes.length),_u16(0),nameBytes,dataBytes);
    var ch=[].concat(_u32(0x02014b50),_u16(20),_u16(20),_u16(0x0800),_u16(0),_u16(0),_u16(0),_u32(crc),_u32(dataBytes.length),_u32(dataBytes.length),_u16(nameBytes.length),_u16(0),_u16(0),_u16(0),_u16(0),_u32(0),_u32(offset),nameBytes);
    local.push(lh); central.push(ch); offset+=lh.length;
  });
  var localFlat=[]; local.forEach(function(a){ localFlat=localFlat.concat(a); });
  var centralFlat=[]; central.forEach(function(a){ centralFlat=centralFlat.concat(a); });
  var eocd=[].concat(_u32(0x06054b50),_u16(0),_u16(0),_u16(files.length),_u16(files.length),_u32(centralFlat.length),_u32(localFlat.length),_u16(0));
  var all=localFlat.concat(centralFlat).concat(eocd);
  var b="";
  var B="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  for(var i=0;i<all.length;i+=3){
    var a0=all[i],a1=all[i+1],a2=all[i+2];
    var n=(a0<<16)|((a1||0)<<8)|(a2||0);
    b+=B[(n>>18)&63]+B[(n>>12)&63]+(i+1<all.length?B[(n>>6)&63]:"=")+(i+2<all.length?B[n&63]:"=");
  }
  return b;
}
