<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>本页媒体</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e1116;color:#cdd3de;font:13px/1.5 -apple-system,"Noto Sans SC",sans-serif;padding:8px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar .src{flex:1;font-size:11px;color:#8b949e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{background:#21262d;color:#cdd3de;border:1px solid #30363d;border-radius:6px;padding:4px 10px;font-size:12px}
button:active{background:#30363d}
.grp{margin:10px 0 4px;font-size:12px;color:#58a6ff;font-weight:600}
.item{display:flex;align-items:center;gap:8px;background:#161b22;border:1px solid #21262d;border-radius:8px;padding:6px;margin-bottom:6px}
.th{width:56px;height:42px;flex:0 0 56px;border-radius:5px;background:#0b0e13;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.nm{flex:1;min-width:0;font-size:12px;word-break:break-all;max-height:3em;overflow:hidden}
.ops{display:flex;flex-direction:column;gap:4px}
.empty{color:#8b949e;text-align:center;padding:24px 0}
.big{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:9;flex-direction:column;gap:8px}
.big img,.big video{max-width:96vw;max-height:82vh}
.big .x{position:fixed;top:8px;right:12px;font-size:22px;color:#fff;background:none;border:none}
.doc{position:fixed;inset:0;background:#0e1116;z-index:9;display:flex;flex-direction:column}
.doc .dh{display:flex;align-items:center;gap:8px;background:#1f6feb;color:#fff;padding:8px 10px}
.doc .dh .t{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .dh button{background:rgba(255,255,255,.15);color:#fff;border:none}
.doc .db{flex:1;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch}
.doc .db.mdv{font-size:13px;line-height:1.65;word-break:break-word}
.doc .db.mdv h1,.doc .db.mdv h2,.doc .db.mdv h3{color:#e6edf3;margin:12px 0 6px;border-bottom:1px solid #21262d;padding-bottom:4px}
.doc .db.mdv pre{background:#161b22;border:1px solid #21262d;border-radius:6px;padding:8px;overflow:auto;font-size:12px;margin:8px 0}
.doc .db.mdv code{background:#161b22;border-radius:4px;padding:1px 4px;font-size:12px}
.doc .db.mdv blockquote{border-left:3px solid #30363d;padding-left:8px;color:#8b949e;margin:6px 0}
.doc .db.mdv a{color:#58a6ff}
.doc .db pre.raw{white-space:pre-wrap;word-break:break-word;font-size:12px}
.doc .db .ld{color:#8b949e;text-align:center;padding:30px 0}
</style>
</head>
<body>
<div class="bar">
  <div class="src" id="src">采集中…</div>
  <button onclick="doRefresh()">↻ 重采</button>
</div>
<div id="list"><div class="empty">采集中…</div></div>
<script>
var ITEMS=[];
var TYPE_META={img:["🖼","图片"],video:["🎬","视频"],audio:["🎵","音频"],md:["📄","Markdown 文档"],file:["📦","文件 / 附件"]};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
// 显示名逐层解码 (附件名常被多层 percent 编码, %25E8… 直显乱码)
function dn(s){try{var t=String(s==null?"":s);for(var i=0;i<3&&/%[0-9a-fA-F]{2}/.test(t);i++){var d=decodeURIComponent(t);if(d===t)break;t=d;}return t;}catch(e){return String(s==null?"":s);}}
function renderMedia(json,pageUrl){
  try{ ITEMS=JSON.parse(json||"[]")||[]; }catch(e){ ITEMS=[]; }
  var src=document.getElementById("src");
  src.textContent=pageUrl?("来源: "+pageUrl):"";
  var box=document.getElementById("list");
  if(!ITEMS.length){ box.innerHTML='<div class="empty">本页未发现媒体资源<br>(图片 / 视频 / 文档 / 附件)</div>'; return; }
  var order=["img","video","audio","md","file"], html="";
  order.forEach(function(tp){
    var arr=ITEMS.map(function(it,i){ it._i=i; return it; }).filter(function(it){ return (it.t||"file")===tp; });
    if(!arr.length) return;
    var m=TYPE_META[tp]||["📦",tp];
    html+='<div class="grp">'+m[0]+" "+m[1]+" ("+arr.length+")</div>";
    arr.forEach(function(it){
      var th=(tp==="img")?('<img loading="lazy" src="'+esc(it.u)+'" onerror="this.parentNode.textContent=\'🖼\'">'):(m[0]);
      html+='<div class="item"><div class="th">'+th+'</div>'
        +'<div class="nm">'+esc(dn(it.n||it.u))+'</div>'
        +'<div class="ops"><button onclick="doView('+it._i+')">查看</button>'
        +'<button onclick="doDl('+it._i+')">下载</button></div></div>';
    });
  });
  box.innerHTML=html;
}
function doRefresh(){ try{ MediaHost.refresh(); }catch(e){} }
var DOCS={}, DOCSEQ=0;
function extOf(u,n){ var s=String(n||u||"").split("?")[0]; var i=s.lastIndexOf("."); return i<0?"":s.slice(i+1).toLowerCase(); }
function isTextExt(x){ return /^(md|markdown|txt|json|csv|log|xml|yml|yaml|js|ts|py|java|sh|html?|css)$/.test(x); }
// 轻量 Markdown 渲染 (无依赖·先转义后替换): 标题/粗斜/行内码/围栏码/引用/列表/链接
function mdRender(src){
  var code=[]; src=String(src).replace(/```([\s\S]*?)```/g,function(_,c){ code.push(c); return "\u0000"+(code.length-1)+"\u0000"; });
  var h=esc(src);
  h=h.replace(/^######\s+(.+)$/gm,"<h3>$1</h3>").replace(/^#####\s+(.+)$/gm,"<h3>$1</h3>").replace(/^####\s+(.+)$/gm,"<h3>$1</h3>")
     .replace(/^###\s+(.+)$/gm,"<h3>$1</h3>").replace(/^##\s+(.+)$/gm,"<h2>$1</h2>").replace(/^#\s+(.+)$/gm,"<h1>$1</h1>")
     .replace(/^&gt;\s?(.+)$/gm,"<blockquote>$1</blockquote>")
     .replace(/^\s*[-*+]\s+(.+)$/gm,"• $1<br>")
     .replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/\*([^*\n]+)\*/g,"<i>$1</i>")
     .replace(/`([^`\n]+)`/g,"<code>$1</code>")
     .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank">$1</a>')
     .replace(/\n\n+/g,"<br><br>").replace(/\n/g,"<br>");
  h=h.replace(/\u0000(\d+)\u0000/g,function(_,i){ return "<pre>"+esc(code[+i])+"</pre>"; });
  return h;
}
function openDoc(it){
  var id=++DOCSEQ;
  var d=document.createElement("div"); d.className="doc";
  d.innerHTML='<div class="dh"><div class="t">'+esc(dn(it.n||it.u))+'</div>'
    +'<button class="dd">⬇ 下载</button><button class="x2">✕</button></div>'
    +'<div class="db" id="db'+id+'"><div class="ld">⏳ 正在加载文档…</div></div>';
  d.querySelector(".dd").onclick=function(){ try{ MediaHost.download(it.u, it.n||""); }catch(e){} };
  d.querySelector(".x2").onclick=function(){ delete DOCS[id]; d.remove(); };
  document.body.appendChild(d);
  DOCS[id]={ ext:extOf(it.u,it.n) };
  try{ MediaHost.fetchDoc(it.u, id); }
  catch(e){ docFailed(id, "桌面桥不可用"); }
}
// 正页点开 MD/文本附件 → 原生直送悬浮窗直看 (查看为主, 不再跳下载)
function openDocExt(url,name){ openDoc({u:url,n:name||""}); }
function docLoaded(id,text){
  var box=document.getElementById("db"+id), m=DOCS[id]; if(!box) return;
  if(m&&/^(md|markdown)$/.test(m.ext)){ box.className="db mdv"; box.innerHTML=mdRender(text); }
  else{ box.innerHTML='<pre class="raw"></pre>'; box.querySelector("pre").textContent=text; }
}
function docFailed(id,err){
  var box=document.getElementById("db"+id); if(!box) return;
  box.innerHTML='<div class="ld">❌ 加载失败: '+esc(err)+'<br><br>可改用「下载」获取文件</div>';
}
function doView(i){
  var it=ITEMS[i]; if(!it) return;
  if(it.t==="img"||it.t==="video"||it.t==="audio"){   // 图片/视频/音频面板内直看 (经原生鉴权代取通路)
    var tag=it.t==="img"?('<img src="'+esc(it.u)+'">'):(it.t==="video"?('<video src="'+esc(it.u)+'" controls autoplay playsinline></video>'):('<audio src="'+esc(it.u)+'" controls autoplay></audio>'));
    var d=document.createElement("div"); d.className="big";
    d.innerHTML=tag+'<button class="x">✕</button>';
    d.onclick=function(ev){ if(ev.target===d||ev.target.className==="x"){ try{var v=d.querySelector("video,audio");if(v)v.pause();}catch(e){} d.remove(); } };
    document.body.appendChild(d);
    var mv=d.querySelector("video,audio,img");
    if(mv) mv.onerror=function(){ d.insertAdjacentHTML("beforeend",'<div style="color:#f85149;font-size:12px;padding:0 12px;text-align:center">⚠ 媒体加载失败 — 可点「下载」取回文件后本地打开</div><button onclick="doDl('+i+')">⬇ 下载</button>'); };
    return;
  }
  var ext=extOf(it.u,it.n);
  if(it.t==="md"||isTextExt(ext)){ openDoc(it); return; }   // MD/文本类 → 悬浮窗内直看正文
  if(ext==="pdf"){   // PDF → 面板内嵌页尝试 (拦截层鉴权代取)
    var p=document.createElement("div"); p.className="doc";
    p.innerHTML='<div class="dh"><div class="t">'+esc(dn(it.n||it.u))+'</div>'
      +'<button class="dd">⬇ 下载</button><button class="x2">✕</button></div>'
      +'<iframe src="'+esc(it.u)+'" style="flex:1;border:none;background:#fff"></iframe>';
    p.querySelector(".dd").onclick=function(){ try{ MediaHost.download(it.u, it.n||""); }catch(e){} };
    p.querySelector(".x2").onclick=function(){ p.remove(); };
    document.body.appendChild(p);
    return;
  }
  doDl(i);   // 其余二进制类型(zip/apk/office): 无法面板内渲染 → 转下载
}
function doDl(i){ var it=ITEMS[i]; if(!it) return; try{ MediaHost.download(it.u, it.n||""); }catch(e){} }
try{ MediaHost.ready(); }catch(e){}
</script>
</body>
</html>
